// Naturalist — NeoForge (Minecraft 1.21.11)
//
// Mirrors fabric/build.gradle: the common sources are compiled IN-PLACE together with the
// loader sources (no cross-project dependency, no remap step).
//
// Owned by: neoforge-shipper (task-4). Write scope: neoforge/**.
// Requires the root build.gradle to declare:
//     id 'net.neoforged.moddev' version '2.0.112' apply false

plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

// gradle.properties has no neo_version yet; the fallback keeps this module self-sufficient.
def neoVersion = (findProperty('neo_version') ?: '21.11.38-beta').toString()

base {
    archivesName = "${mod_id}-${mod_version}-neoforge-${minecraft_version}"
}

neoForge {
    version = neoVersion

    // NeoForge uses access TRANSFORMERS (.cfg), not Fabric access wideners. The AT file
    // lives in the common tree (owned by other teammates — read only).
    def at = file('../common/src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }
        server {
            server()
            gameDirectory = project.file('run/server')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// The jar is built from the common sources plus the NeoForge loader sources,
// exactly like the Fabric module.
sourceSets {
    main {
        java.srcDir '../common/src/main/java'
        resources.srcDir '../common/src/main/resources'
    }
}

// The Field Guide mod has no 1.21.11 build (it jumps 1.21.1 -> 26.1.2), so its optional
// compatibility layer cannot be compiled against 1.21.11. It stays in the tree, uncompiled.
sourceSets.main.java.exclude 'com/crispytwig/naturalist/compat/fieldguide/**'

// Datagen is a NeoForge dev-time tool only and is not part of the shipped mod jar.
sourceSets.main.java.exclude 'com/crispytwig/naturalist/datagen/**'

dependencies {
    // Mixin annotations. NeoForge ships Mixin + MixinExtras at runtime, so these are
    // compile-only exactly as in the Fabric module.
    compileOnly "net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7"
    compileOnly "io.github.llamalad7:mixinextras-common:0.5.3"

    compileOnly "org.jetbrains:annotations:24.1.0"
    compileOnly "org.jspecify:jspecify:1.0.0"

    // Optional compat: LambDynamicLights 4.9.1+1.21.11 (Modrinth lists fabric + neoforge + quilt).
    // The plain artifact is the FABRIC build: its API signatures reference intermediary names
    // (net.minecraft.class_1297), which cannot compile against NeoForge's mojmap game jar.
    // The `mojmap` classifier is the counterpart NeoForge build and is what must be used here.
    // Verified: ...-4.9.1+1.21.11-mojmap.jar declares getLuminance(ItemLightSourceManager, net.minecraft.world.entity.Entity).
    compileOnly "dev.lambdaurora.lambdynamiclights:lambdynamiclights-api:4.9.1+1.21.11:mojmap"
}

tasks.named('processResources', ProcessResources) {
    var expandProps = [
            'version'                : mod_version,
            'mod_version'            : mod_version,
            'mod_id'                 : mod_id,
            'mod_name'               : mod_name,
            'mod_license'            : mod_license,
            'mod_description'        : mod_description,
            'mod_authors'            : mod_authors,
            'minecraft_version'      : minecraft_version,
            'minecraft_version_range': minecraft_version_range,
            'neo_version'            : neoVersion,
            'loader_version_range'   : loader_version_range,
            'java_version'           : java_version
    ]

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    inputs.properties(expandProps)
}

tasks.named('jar', Jar) {
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}
